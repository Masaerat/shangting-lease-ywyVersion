server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/lease?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:lease}
    password: ${MYSQL_PASSWORD:lease}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lease}
    password: ${RABBITMQ_PASSWORD:lease}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    openai:
      base-url: ${AI_CHAT_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
      api-key: ${AI_CHAT_API_KEY:}
      completions-path: /chat/completions
      embeddings-path: /embeddings
      chat:
        base-url: ${AI_CHAT_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:gpt-5.6-terra}
      embedding:
        base-url: ${AI_EMBED_BASE_URL:${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}}
        embeddings-path: ${AI_EMBEDDINGS_PATH:/embeddings}
        api-key: ${AI_EMBED_API_KEY:${AI_CHAT_API_KEY:}}
        options:
          model: ${AI_EMBED_MODEL:embedding-2}
          dimensions: ${AI_EMBED_DIM:1024}
    vectorstore:
      pgvector:
        dimensions: ${AI_EMBED_DIM:1024}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:lease-admin}
  secret-key: ${MINIO_SECRET_KEY:lease-admin-12345}
  bucket-name: ${MINIO_BUCKET:lease}

aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    endpoint: dysmsapi.aliyuncs.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  # Knife4j 4.5.0 的可选增强器与 Springdoc 2.8.x API 不兼容；UI 和接口调试不依赖该增强器。
  enable: false
  setting:
    language: zh_cn

app:
  outbox:
    enabled: true
    fixed-delay-ms: 1000
    initial-delay-ms: 2000
  datasource:
    pg:
      url: ${PG_URL:jdbc:postgresql://pgvector:5432/lease_vec}
      username: ${PG_USER:lease}
      password: ${PG_PASSWORD:lease}
  demo-login:
    enabled: ${DEMO_LOGIN_ENABLED:true}
    phone: ${DEMO_LOGIN_PHONE:13800000000}
    code: ${DEMO_LOGIN_CODE:888888}
  ai:
    agent:
      primary-model: ${AI_AGENT_PRIMARY_MODEL:${AI_CHAT_MODEL:gpt-5.6-terra}}
      fallback-model: ${AI_AGENT_FALLBACK_MODEL:}
      max-steps: ${AI_AGENT_MAX_STEPS:6}
      max-same-tool-calls: ${AI_AGENT_MAX_SAME_TOOL_CALLS:3}
      timeout-ms: ${AI_AGENT_TIMEOUT_MS:15000}
      tool-timeout-ms: ${AI_AGENT_TOOL_TIMEOUT_MS:3000}
      trajectory-enabled: ${AI_AGENT_TRAJECTORY_ENABLED:true}
    rag:
      chunk-size: 800
      min-chunk-size-chars: 350
      min-chunk-length-to-embed: 5
      max-num-chunks: 10000
      top-k: 5
      similarity-threshold: 0.75
      history-turns: 10
      memory-recent-turns: ${AI_MEMORY_RECENT_TURNS:6}
      memory-max-recent-chars: ${AI_MEMORY_MAX_RECENT_CHARS:6000}
      memory-max-context-chars: ${AI_MEMORY_MAX_CONTEXT_CHARS:8000}
      memory-summary-max-chars: ${AI_MEMORY_SUMMARY_MAX_CHARS:2000}
      memory-summary-item-max-chars: ${AI_MEMORY_SUMMARY_ITEM_MAX_CHARS:240}
      memory-message-max-chars: ${AI_MEMORY_MESSAGE_MAX_CHARS:2000}
      rrf-k: ${AI_RAG_RRF_K:60}
      vector-weight: ${AI_RAG_VECTOR_WEIGHT:1.0}
      lexical-weight: ${AI_RAG_LEXICAL_WEIGHT:0.8}
      category-boost: ${AI_RAG_CATEGORY_BOOST:0.08}
      namespace-default: default
